d<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEON TRACKER // PERFORMANCE</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Consolas, monospace;
}

/* Camera există doar pentru AI */
#camera {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
}

.hud {
    position: fixed;
    z-index: 10;
    padding: 12px 15px;

    color: #00ff9d;
    background: rgba(0,0,0,.8);

    border: 1px solid #00ff9d;

    font-size: 13px;
}

#left {
    top: 15px;
    left: 15px;
}

#right {
    top: 15px;
    right: 15px;
    text-align: right;
}

.title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

#status {
    margin-top: 5px;
}

#message {
    position: fixed;
    z-index: 10;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    color: #00ff9d;

    letter-spacing: 4px;
    font-size: 14px;

    white-space: nowrap;
}

/* scanline foarte simplă */
#scan {
    position: fixed;
    z-index: 5;

    width: 100%;
    height: 1px;

    background: rgba(0,255,157,.6);

    animation: scan 3s linear infinite;

    pointer-events: none;
}

@keyframes scan {
    from { top: 0%; }
    to   { top: 100%; }
}
</style>
</head>

<body>

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="scan"></div>

<div id="left" class="hud">

    <div class="title">
        NEON TRACKER
    </div>

    <div id="status">
        INITIALIZING...
    </div>

    <div id="face">
        FACE: --
    </div>

    <div id="hands">
        HANDS: --
    </div>

</div>

<div id="right" class="hud">

    <div id="displayFPS">
        DISPLAY: 0 FPS
    </div>

    <div id="aiFPS">
        AI: 0 FPS
    </div>

    <div id="fingers">
        FINGERS: 0
    </div>

</div>

<div id="message">
    STARTING SYSTEM
</div>


<script type="module">

import {
    FaceLandmarker,
    HandLandmarker,
    FilesetResolver,
    DrawingUtils
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";


/* ==============================
   CONFIG PERFORMANCE
================================ */

const AI_INTERVAL = 80;

/*
80ms ≈ maxim 12.5 update-uri AI/sec.

Dacă laptopul merge bine:
60 = ~16 FPS AI

Dacă merge greu:
100 = ~10 FPS AI
*/


/* ==============================
   ELEMENTE
================================ */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: true
    });


const statusEl =
    document.getElementById("status");

const faceEl =
    document.getElementById("face");

const handsEl =
    document.getElementById("hands");

const displayFPSEl =
    document.getElementById("displayFPS");

const aiFPSEl =
    document.getElementById("aiFPS");

const fingersEl =
    document.getElementById("fingers");

const messageEl =
    document.getElementById("message");


/* ==============================
   MODELE
================================ */

let faceLandmarker;
let handLandmarker;


/* ==============================
   REZULTATE SALVATE
================================ */

let cachedFace = null;
let cachedHands = [];


/* ==============================
   TIMING
================================ */

let lastAITime = 0;

let runFaceNext = true;

let displayFrames = 0;
let aiFrames = 0;

let fpsTimer =
    performance.now();


/* ==============================
   CAMERA LOW RESOLUTION
================================ */

async function startCamera() {

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                width: {
                    ideal: 480
                },

                height: {
                    ideal: 360
                },

                frameRate: {
                    ideal: 30,
                    max: 30
                },

                facingMode:
                    "user"

            },

            audio: false

        });


    video.srcObject =
        stream;


    await new Promise(resolve => {

        video.onloadedmetadata =
            resolve;

    });


    await video.play();


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}


/* ==============================
   MEDIAPIPE
================================ */

async function loadModels() {

    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


    /*
       FACE
    */

    faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",

                    delegate: "GPU"

                },

                runningMode:
                    "VIDEO",

                numFaces:
                    1,

                minFaceDetectionConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5

            }

        );


    /*
       HAND
    */

    handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",

                    delegate: "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    2,

                minHandDetectionConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5

            }

        );
}


/* ==============================
   FACE DRAW
================================ */

function drawFace(face) {

    if (!face)
        return;


    const drawing =
        new DrawingUtils(ctx);


    /*
       Fără shadowBlur!
       Este mult mai rapid pe Intel HD.
    */


    drawing.drawConnectors(

        face,

        FaceLandmarker
            .FACE_LANDMARKS_TESSELATION,

        {
            color:
                "rgba(255,0,255,.40)",

            lineWidth:
                0.6
        }

    );


    drawing.drawConnectors(

        face,

        FaceLandmarker
            .FACE_LANDMARKS_FACE_OVAL,

        {
            color:
                "#ff00ff",

            lineWidth:
                1.5
        }

    );


    drawing.drawConnectors(

        face,

        FaceLandmarker
            .FACE_LANDMARKS_LEFT_EYE,

        {
            color:
                "#00ffff",

            lineWidth:
                1.5
        }

    );


    drawing.drawConnectors(

        face,

        FaceLandmarker
            .FACE_LANDMARKS_RIGHT_EYE,

        {
            color:
                "#00ffff",

            lineWidth:
                1.5
        }

    );


    drawing.drawConnectors(

        face,

        FaceLandmarker
            .FACE_LANDMARKS_LIPS,

        {
            color:
                "#ff375f",

            lineWidth:
                1.5
        }

    );
}


/* ==============================
   HAND DRAW
================================ */

function drawHand(hand) {

    const drawing =
        new DrawingUtils(ctx);


    drawing.drawConnectors(

        hand,

        HandLandmarker
            .HAND_CONNECTIONS,

        {
            color:
                "#00ff9d",

            lineWidth:
                2
        }

    );


    drawing.drawLandmarks(

        hand,

        {
            color:
                "#00ff9d",

            fillColor:
                "#00ff9d",

            radius:
                2
        }

    );
}


/* ==============================
   COUNT FINGERS
================================ */

function countFingers(hand) {

    let count = 0;


    const fingers = [

        [8, 6],

        [12, 10],

        [16, 14],

        [20, 18]

    ];


    for (
        const [tip, pip]
        of fingers
    ) {

        if (
            hand[tip].y <
            hand[pip].y
        ) {

            count++;

        }
    }


    /*
       Thumb aproximativ
    */

    const thumbDistance =
        Math.abs(
            hand[4].x -
            hand[5].x
        );


    const jointDistance =
        Math.abs(
            hand[3].x -
            hand[5].x
        );


    if (
        thumbDistance >
        jointDistance
    ) {

        count++;

    }


    return count;
}


/* ==============================
   AI UPDATE
================================ */

function updateAI(now) {

    /*
       Alternăm:

       update 1 = FACE
       update 2 = HAND
       update 3 = FACE
       update 4 = HAND

       Nu mai rulăm ambele modele
       în același frame.
    */


    if (runFaceNext) {

        const result =
            faceLandmarker
            .detectForVideo(
                video,
                now
            );


        if (
            result.faceLandmarks &&
            result.faceLandmarks.length
        ) {

            cachedFace =
                result.faceLandmarks[0];

            faceEl.textContent =
                "FACE: LOCKED";

        }

        else {

            cachedFace =
                null;

            faceEl.textContent =
                "FACE: SEARCHING";

        }

    }

    else {

        const result =
            handLandmarker
            .detectForVideo(
                video,
                now
            );


        cachedHands =
            result.landmarks || [];


        handsEl.textContent =
            "HANDS: " +
            cachedHands.length;


        let total = 0;


        for (
            const hand
            of cachedHands
        ) {

            total +=
                countFingers(hand);

        }


        fingersEl.textContent =
            "FINGERS: " +
            total;


        if (total === 5) {

            messageEl.textContent =
                "PALM DETECTED";

        }

        else if (total > 0) {

            messageEl.textContent =
                "GESTURE " +
                total;

        }

        else {

            messageEl.textContent =
                "SCAN PERFORMING";

        }

    }


    runFaceNext =
        !runFaceNext;


    aiFrames++;
}


/* ==============================
   FPS COUNTER
================================ */

function updateFPS(now) {

    displayFrames++;


    if (
        now - fpsTimer >=
        1000
    ) {

        displayFPSEl.textContent =
            "DISPLAY: " +
            displayFrames +
            " FPS";


        aiFPSEl.textContent =
            "AI: " +
            aiFrames +
            " UPDATES/S";


        displayFrames = 0;
        aiFrames = 0;

        fpsTimer = now;

    }
}


/* ==============================
   RENDER 60 FPS
================================ */

function render(now) {

    /*
       AI nu rulează la fiecare
       requestAnimationFrame.
    */

    if (
        now - lastAITime >=
        AI_INTERVAL
    ) {

        updateAI(now);

        lastAITime = now;

    }


    /*
       Canvas-ul poate continua
       la refresh-ul monitorului.
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       desenăm rezultatele salvate
    */

    drawFace(
        cachedFace
    );


    for (
        const hand
        of cachedHands
    ) {

        drawHand(hand);

    }


    updateFPS(now);


    requestAnimationFrame(
        render
    );
}


/* ==============================
   START
================================ */

async function start() {

    try {

        statusEl.textContent =
            "CAMERA...";


        await startCamera();


        statusEl.textContent =
            "LOADING AI...";


        messageEl.textContent =
            "LOADING MODELS";


        await loadModels();


        statusEl.textContent =
            "● SYSTEM ONLINE";


        messageEl.textContent =
            "SCAN PERFORMING";


        requestAnimationFrame(
            render
        );

    }

    catch(error) {

        console.error(error);


        statusEl.textContent =
            "ERROR";


        messageEl.textContent =
            error.message;

    }
}


start();

</script>

</body>
</html>
