<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Face & Hand Scanner</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Consolas, monospace;
}

/* Camera există pentru AI, dar NU este vizibilă */
#camera {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* Canvas-ul cu tracking */
#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    /* efect oglindă */
    transform: scaleX(-1);

    z-index: 2;
}

/* HUD */
.hud {
    position: fixed;
    z-index: 10;

    color: #00ff9d;

    background: rgba(0, 0, 0, 0.7);

    border: 1px solid #00ff9d;

    padding: 14px 18px;

    box-shadow:
        0 0 10px rgba(0,255,157,.5),
        inset 0 0 10px rgba(0,255,157,.1);

    backdrop-filter: blur(5px);
}

#topLeft {
    top: 18px;
    left: 18px;
}

#topRight {
    top: 18px;
    right: 18px;
    text-align: right;
}

.title {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
}

.small {
    margin-top: 6px;
    font-size: 13px;
}

#status {
    color: #ff375f;
}

/* Scan line */
#scanline {
    position: fixed;

    z-index: 4;

    left: 0;

    width: 100%;
    height: 2px;

    background: #00ff9d;

    box-shadow:
        0 0 6px #00ff9d,
        0 0 15px #00ff9d,
        0 0 30px #00ff9d;

    animation: scan 3s linear infinite;

    pointer-events: none;
}

@keyframes scan {

    0% {
        top: 0%;
        opacity: .2;
    }

    50% {
        top: 100%;
        opacity: 1;
    }

    100% {
        top: 0%;
        opacity: .2;
    }
}

/* Mesaj jos */
#message {
    position: fixed;

    z-index: 10;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    color: #00ff9d;

    font-size: 16px;

    letter-spacing: 4px;

    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px #00ff9d;

    white-space: nowrap;
}

/* Colțuri HUD */
.corner {
    position: fixed;

    z-index: 5;

    width: 55px;
    height: 55px;

    pointer-events: none;
}

.c1 {
    left: 15px;
    bottom: 15px;

    border-left: 2px solid #00ff9d;
    border-bottom: 2px solid #00ff9d;
}

.c2 {
    right: 15px;
    bottom: 15px;

    border-right: 2px solid #00ff9d;
    border-bottom: 2px solid #00ff9d;
}

/* punct central */
#target {
    position: fixed;

    z-index: 3;

    left: 50%;
    top: 50%;

    width: 8px;
    height: 8px;

    border: 1px solid rgba(0,255,157,.3);
    border-radius: 50%;

    transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<!-- Camera este ascunsă -->
<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<!-- Aici desenăm fața și mâinile -->
<canvas id="canvas"></canvas>

<div id="scanline"></div>

<div id="target"></div>

<div id="topLeft" class="hud">

    <div class="title">
        NEON AI SCANNER
    </div>

    <div id="status" class="small">
        ● INITIALIZING
    </div>

    <div id="faceStatus" class="small">
        FACE: --
    </div>

    <div id="handStatus" class="small">
        HANDS: --
    </div>

</div>

<div id="topRight" class="hud">

    <div id="fps">
        FPS: 0
    </div>

    <div id="fingerCount" class="small">
        FINGERS: 0
    </div>

</div>

<div id="message">
    INITIALIZING AI
</div>

<div class="corner c1"></div>
<div class="corner c2"></div>


<script type="module">

import {
    FaceLandmarker,
    HandLandmarker,
    FilesetResolver,
    DrawingUtils
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";


/* ==========================
   ELEMENTE
========================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const statusText =
    document.getElementById("status");

const faceStatus =
    document.getElementById("faceStatus");

const handStatus =
    document.getElementById("handStatus");

const fpsText =
    document.getElementById("fps");

const fingerText =
    document.getElementById("fingerCount");

const message =
    document.getElementById("message");


/* ==========================
   AI
========================== */

let faceLandmarker;
let handLandmarker;

let lastVideoTime = -1;


/* ==========================
   FPS
========================== */

let frameCounter = 0;

let lastFPSTime =
    performance.now();


/* ==========================
   CAMERA
========================== */

async function startCamera() {

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video: {

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                },

                facingMode: "user"

            },

            audio: false

        });


    video.srcObject =
        stream;


    await new Promise(resolve => {

        video.onloadedmetadata =
            resolve;

    });


    await video.play();
}


/* ==========================
   ÎNCĂRCARE MEDIAPIPE
========================== */

async function loadAI() {

    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );


    /* FACE */

    faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",

                    delegate: "GPU"

                },

                runningMode: "VIDEO",

                numFaces: 1

            }

        );


    /* HANDS */

    handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",

                    delegate: "GPU"

                },

                runningMode: "VIDEO",

                numHands: 2

            }

        );
}


/* ==========================
   CANVAS
========================== */

function resizeCanvas() {

    if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
    ) {

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

    }
}


/* ==========================
   DESENARE FAȚĂ
========================== */

function drawFace(landmarks) {

    const drawing =
        new DrawingUtils(ctx);


    ctx.save();


    ctx.shadowBlur =
        10;

    ctx.shadowColor =
        "#ff00ff";


    /* TRIUNGHIURI */

    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_TESSELATION,

        {

            color:
                "rgba(255,0,255,0.50)",

            lineWidth:
                0.8

        }

    );


    /* CONTUR */

    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_FACE_OVAL,

        {

            color:
                "#ff00ff",

            lineWidth:
                2

        }

    );


    /* OCHI */

    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_LEFT_EYE,

        {

            color:
                "#00ffff",

            lineWidth:
                2

        }

    );


    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_RIGHT_EYE,

        {

            color:
                "#00ffff",

            lineWidth:
                2

        }

    );


    /* SPRÂNCENE */

    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_LEFT_EYEBROW,

        {

            color:
                "#00ffff",

            lineWidth:
                1.5

        }

    );


    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_RIGHT_EYEBROW,

        {

            color:
                "#00ffff",

            lineWidth:
                1.5

        }

    );


    /* BUZE */

    drawing.drawConnectors(

        landmarks,

        FaceLandmarker
            .FACE_LANDMARKS_LIPS,

        {

            color:
                "#ff375f",

            lineWidth:
                2

        }

    );


    ctx.restore();

}


/* ==========================
   DESENARE MÂINI
========================== */

function drawHand(landmarks) {

    const drawing =
        new DrawingUtils(ctx);


    ctx.save();


    ctx.shadowBlur =
        15;

    ctx.shadowColor =
        "#00ff9d";


    /* LINII */

    drawing.drawConnectors(

        landmarks,

        HandLandmarker
            .HAND_CONNECTIONS,

        {

            color:
                "#00ff9d",

            lineWidth:
                3

        }

    );


    /* PUNCTE */

    drawing.drawLandmarks(

        landmarks,

        {

            color:
                "#ffffff",

            fillColor:
                "#00ff9d",

            radius:
                3

        }

    );


    ctx.restore();

}


/* ==========================
   NUMĂR DEGETE
========================== */

function countFingers(hand) {

    let count = 0;


    /*
       INDEX
       MIJLOCIU
       INELAR
       MIC
    */

    const fingers = [

        [8, 6],

        [12, 10],

        [16, 14],

        [20, 18]

    ];


    for (
        const [tip, joint]
        of fingers
    ) {

        if (
            hand[tip].y <
            hand[joint].y
        ) {

            count++;

        }

    }


    /*
       DEGETUL MARE
    */

    const thumbTip =
        hand[4];

    const thumbJoint =
        hand[3];

    const indexBase =
        hand[5];


    const tipDistance =
        Math.abs(
            thumbTip.x -
            indexBase.x
        );


    const jointDistance =
        Math.abs(
            thumbJoint.x -
            indexBase.x
        );


    if (
        tipDistance >
        jointDistance
    ) {

        count++;

    }


    return count;
}


/* ==========================
   FPS
========================== */

function updateFPS(now) {

    frameCounter++;


    if (
        now -
        lastFPSTime >=
        1000
    ) {

        fpsText.textContent =
            "FPS: " +
            frameCounter;


        frameCounter = 0;

        lastFPSTime =
            now;

    }
}


/* ==========================
   LOOP PRINCIPAL
========================== */

function render() {

    const now =
        performance.now();


    if (

        video.readyState >= 2 &&

        faceLandmarker &&

        handLandmarker

    ) {

        resizeCanvas();


        if (
            video.currentTime !==
            lastVideoTime
        ) {

            lastVideoTime =
                video.currentTime;


            /*
               ȘTERGE FRAME-UL VECHI
            */

            ctx.clearRect(

                0,
                0,

                canvas.width,
                canvas.height

            );


            /*
               FACE AI
            */

            const faceResult =
                faceLandmarker
                .detectForVideo(

                    video,

                    now

                );


            /*
               HAND AI
            */

            const handResult =
                handLandmarker
                .detectForVideo(

                    video,

                    now

                );


            /* ==================
               FACE
            ================== */

            if (

                faceResult
                    .faceLandmarks &&

                faceResult
                    .faceLandmarks
                    .length > 0

            ) {

                drawFace(

                    faceResult
                        .faceLandmarks[0]

                );


                faceStatus.textContent =
                    "FACE: LOCKED";


                statusText.textContent =
                    "● SCAN LOCKED";


                statusText.style.color =
                    "#00ff9d";

            }

            else {

                faceStatus.textContent =
                    "FACE: SEARCHING";


                statusText.textContent =
                    "● SEARCHING";


                statusText.style.color =
                    "#ff375f";

            }


            /* ==================
               HANDS
            ================== */

            let totalFingers = 0;


            if (

                handResult.landmarks &&

                handResult.landmarks
                    .length > 0

            ) {


                for (
                    const hand
                    of handResult.landmarks
                ) {

                    drawHand(hand);


                    totalFingers +=
                        countFingers(hand);

                }


                handStatus.textContent =
                    "HANDS: " +
                    handResult
                        .landmarks
                        .length;

            }

            else {

                handStatus.textContent =
                    "HANDS: 0";

            }


            fingerText.textContent =
                "FINGERS: " +
                totalFingers;


            /* ==================
               GESTURI
            ================== */

            if (
                totalFingers === 10
            ) {

                message.textContent =
                    "FULL HAND SCAN";

            }

            else if (
                totalFingers === 5
            ) {

                message.textContent =
                    "PALM DETECTED";

            }

            else if (
                totalFingers > 0
            ) {

                message.textContent =
                    "GESTURE " +
                    totalFingers;

            }

            else {

                message.textContent =
                    "SCAN PERFORMING";

            }


            updateFPS(now);

        }

    }


    requestAnimationFrame(
        render
    );

}


/* ==========================
   START
========================== */

async function start() {

    try {

        statusText.textContent =
            "● STARTING CAMERA";


        message.textContent =
            "CAMERA INITIALIZING";


        await startCamera();


        statusText.textContent =
            "● LOADING AI";


        message.textContent =
            "LOADING AI MODELS";


        await loadAI();


        statusText.textContent =
            "● AI READY";


        statusText.style.color =
            "#00ff9d";


        message.textContent =
            "SCAN PERFORMING";


        render();

    }

    catch(error) {

        console.error(error);


        statusText.textContent =
            "● SYSTEM ERROR";


        statusText.style.color =
            "#ff375f";


        message.textContent =
            error.message;

    }

}


start();

</script>

</body>
</html>
