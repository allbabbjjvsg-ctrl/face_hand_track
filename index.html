<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neon Face Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #00ff9d;
      font-family: monospace;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* efect oglindă */
      transform: scaleX(-1);

      opacity: 0.38;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;

      transform: scaleX(-1);
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;

      z-index: 10;

      padding: 14px 18px;

      border: 1px solid #00ff9d;
      background: rgba(0,0,0,.55);

      box-shadow:
        0 0 10px #00ff9d,
        inset 0 0 10px rgba(0,255,157,.2);
    }

    #title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    #status {
      margin-top: 8px;
    }

    #fps {
      margin-top: 4px;
      color: white;
    }

    #scanLine {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 2px;

      background: #00ff9d;

      box-shadow:
        0 0 5px #00ff9d,
        0 0 15px #00ff9d,
        0 0 30px #00ff9d;

      animation: scan 3s linear infinite;

      z-index: 5;

      opacity: .7;
    }

    @keyframes scan {
      0% {
        top: 0%;
      }

      50% {
        top: 100%;
      }

      100% {
        top: 0%;
      }
    }

    #loading {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #00ff9d;

      font-size: 22px;

      text-shadow: 0 0 10px #00ff9d;

      z-index: 20;
    }
  </style>
</head>

<body>

<div id="container">

  <video id="video" autoplay playsinline muted></video>

  <canvas id="canvas"></canvas>

  <div id="scanLine"></div>

  <div id="hud">

    <div id="title">
      NEON FACE SCAN
    </div>

    <div id="status">
      INITIALIZING...
    </div>

    <div id="fps">
      FPS: 0
    </div>

  </div>

  <div id="loading">
    LOADING AI MODEL...
  </div>

</div>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver,
  DrawingUtils
}

from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const statusText =
  document.getElementById("status");

const fpsText =
  document.getElementById("fps");

const loading =
  document.getElementById("loading");


let faceLandmarker;

let lastVideoTime = -1;

let frames = 0;

let lastFPSUpdate =
  performance.now();


async function setupCamera() {

  const stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        },

        facingMode: "user"

      },

      audio: false

    });


  video.srcObject = stream;


  return new Promise(resolve => {

    video.onloadedmetadata = () => {

      video.play();

      resolve();

    };

  });

}


async function createAI() {

  const vision =
    await FilesetResolver.forVisionTasks(

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

    );


  faceLandmarker =
    await FaceLandmarker.createFromOptions(

      vision,

      {

        baseOptions: {

          modelAssetPath:

          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",

          delegate: "GPU"

        },

        runningMode: "VIDEO",

        numFaces: 1,

        outputFaceBlendshapes: true

      }

    );

}


function resizeCanvas() {

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

}


function drawFace(landmarks) {

  const drawingUtils =
    new DrawingUtils(ctx);


  ctx.save();


  /*
    MESH COMPLET
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_TESSELATION,

    {

      color: "rgba(0,255,157,0.35)",

      lineWidth: 0.7

    }

  );


  /*
    CONTUR FAȚĂ
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,

    {

      color: "#00ff9d",

      lineWidth: 2

    }

  );


  /*
    OCHI STÂNG
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,

    {

      color: "#00ffff",

      lineWidth: 2

    }

  );


  /*
    OCHI DREPT
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,

    {

      color: "#00ffff",

      lineWidth: 2

    }

  );


  /*
    SPRÂNCENE
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW,

    {

      color: "#00ff9d",

      lineWidth: 1.5

    }

  );


  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW,

    {

      color: "#00ff9d",

      lineWidth: 1.5

    }

  );


  /*
    BUZE
  */

  drawingUtils.drawConnectors(

    landmarks,

    FaceLandmarker.FACE_LANDMARKS_LIPS,

    {

      color: "#ff00ff",

      lineWidth: 2

    }

  );


  /*
    PUNCTELE FEȚEI
  */

  ctx.shadowBlur = 10;

  ctx.shadowColor =
    "#00ff9d";


  for (let i = 0; i < landmarks.length; i += 3) {

    const point =
      landmarks[i];


    const x =
      point.x * canvas.width;

    const y =
      point.y * canvas.height;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.5,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#00ff9d";

    ctx.fill();

  }


  ctx.restore();

}


async function render() {

  if (

    video.readyState >= 2 &&
    faceLandmarker

  ) {

    if (

      canvas.width !==
      video.videoWidth

    ) {

      resizeCanvas();

    }


    const now =
      performance.now();


    if (

      video.currentTime !==
      lastVideoTime

    ) {

      lastVideoTime =
        video.currentTime;


      const result =
        faceLandmarker.detectForVideo(

          video,
          now

        );


      ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

      );


      if (

        result.faceLandmarks &&
        result.faceLandmarks.length > 0

      ) {

        statusText.textContent =
          "● FACE LOCKED";

        statusText.style.color =
          "#00ff9d";


        drawFace(

          result.faceLandmarks[0]

        );

      }

      else {

        statusText.textContent =
          "SEARCHING FOR FACE...";

        statusText.style.color =
          "#ff0055";

      }


      frames++;

    }


    if (

      now - lastFPSUpdate >= 1000

    ) {

      fpsText.textContent =
        "FPS: " + frames;

      frames = 0;

      lastFPSUpdate = now;

    }

  }


  requestAnimationFrame(render);

}


async function start() {

  try {

    statusText.textContent =
      "STARTING CAMERA...";


    await setupCamera();


    statusText.textContent =
      "LOADING FACE AI...";


    await createAI();


    loading.style.display =
      "none";


    statusText.textContent =
      "SEARCHING FOR FACE...";


    render();

  }

  catch(error) {

    console.error(error);


    loading.innerHTML =

      "ERROR<br><small>" +

      error.message +

      "</small>";


    statusText.textContent =
      "SYSTEM ERROR";

  }

}


start();

</script>

</body>
</html>
