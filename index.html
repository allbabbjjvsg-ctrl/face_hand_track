<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face + Hand Scanner</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Consolas, monospace;
}

#camera, #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#camera {
    opacity: .52;
}

#canvas {
    z-index: 2;
}

.hud {
    position: fixed;
    z-index: 10;
    color: #00ff9d;
    background: rgba(0,0,0,.55);
    border: 1px solid #00ff9d;
    padding: 14px 18px;
    box-shadow: 0 0 15px #00ff9d55;
    backdrop-filter: blur(5px);
}

#topLeft {
    top: 18px;
    left: 18px;
}

#topRight {
    top: 18px;
    right: 18px;
    text-align: right;
}

.title {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
}

.small {
    margin-top: 5px;
    font-size: 13px;
}

#status {
    color: #ff375f;
}

#scanline {
    position: fixed;
    z-index: 4;
    left: 0;
    width: 100%;
    height: 2px;
    background: #00ff9d;
    box-shadow:
        0 0 8px #00ff9d,
        0 0 20px #00ff9d;
    animation: scan 3s linear infinite;
    pointer-events: none;
}

@keyframes scan {
    0%   { top: 0%; opacity: .2; }
    50%  { top: 100%; opacity: 1; }
    100% { top: 0%; opacity: .2; }
}

#centerMessage {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    color: #00ff9d;
    letter-spacing: 4px;
    text-shadow: 0 0 12px #00ff9d;
}

.corner {
    position: fixed;
    z-index: 5;
    width: 50px;
    height: 50px;
    border-color: #00ff9d;
}

.c1 {
    left: 12px;
    bottom: 12px;
    border-left: 2px solid;
    border-bottom: 2px solid;
}

.c2 {
    right: 12px;
    bottom: 12px;
    border-right: 2px solid;
    border-bottom: 2px solid;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="scanline"></div>

<div id="topLeft" class="hud">
    <div class="title">AI NEON SCANNER</div>
    <div id="status" class="small">● INITIALIZING</div>
    <div id="faceStatus" class="small">FACE: --</div>
    <div id="handStatus" class="small">HANDS: --</div>
</div>

<div id="topRight" class="hud">
    <div id="fps">FPS: 0</div>
    <div id="fingerCount" class="small">FINGERS: 0</div>
</div>

<div id="centerMessage">
    SCAN PERFORMING
</div>

<div class="corner c1"></div>
<div class="corner c2"></div>

<script type="module">

import {
    FaceLandmarker,
    HandLandmarker,
    FilesetResolver,
    DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";

const video = document.querySelector("#camera");
const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");

const status = document.querySelector("#status");
const faceStatus = document.querySelector("#faceStatus");
const handStatus = document.querySelector("#handStatus");
const fpsElement = document.querySelector("#fps");
const fingerElement = document.querySelector("#fingerCount");
const centerMessage = document.querySelector("#centerMessage");

let faceLandmarker;
let handLandmarker;

let lastVideoTime = -1;

let frames = 0;
let fps = 0;
let fpsTimer = performance.now();

async function cameraStart() {

    const stream =
        await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user"
            },
            audio: false
        });

    video.srcObject = stream;

    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });

    await video.play();
}

async function loadAI() {

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
        );

    faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
                    delegate: "GPU"
                },

                runningMode: "VIDEO",
                numFaces: 1
            }
        );

    handLandmarker =
        await HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
                    delegate: "GPU"
                },

                runningMode: "VIDEO",
                numHands: 2
            }
        );
}

function resize() {

    if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
    ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    }
}

function drawFace(landmarks) {

    const drawing = new DrawingUtils(ctx);

    ctx.save();

    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ff00ff";

    drawing.drawConnectors(
        landmarks,
        FaceLandmarker.FACE_LANDMARKS_TESSELATION,
        {
            color: "rgba(255,0,255,.42)",
            lineWidth: .7
        }
    );

    drawing.drawConnectors(
        landmarks,
        FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,
        {
            color: "#ff00ff",
            lineWidth: 2
        }
    );

    drawing.drawConnectors(
        landmarks,
        FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,
        {
            color: "#00ffff",
            lineWidth: 2
        }
    );

    drawing.drawConnectors(
        landmarks,
        FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
        {
            color: "#00ffff",
            lineWidth: 2
        }
    );

    drawing.drawConnectors(
        landmarks,
        FaceLandmarker.FACE_LANDMARKS_LIPS,
        {
            color: "#ff375f",
            lineWidth: 2
        }
    );

    ctx.restore();
}

function drawHand(landmarks) {

    const drawing =
        new DrawingUtils(ctx);

    ctx.save();

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#00ff9d";

    drawing.drawConnectors(
        landmarks,
        HandLandmarker.HAND_CONNECTIONS,
        {
            color: "#00ff9d",
            lineWidth: 3
        }
    );

    drawing.drawLandmarks(
        landmarks,
        {
            color: "#ffffff",
            fillColor: "#00ff9d",
            radius: 3
        }
    );

    ctx.restore();
}

/*
   Detectarea degetelor este intenționat simplă.
   Pentru index/middle/ring/pinky verificăm dacă
   vârful este mai sus decât articulația PIP.
*/
function fingersUp(hand) {

    let count = 0;

    const fingers = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
    ];

    for (const [tip, pip] of fingers) {

        if (hand[tip].y < hand[pip].y) {
            count++;
        }
    }

    /*
      Thumb:
      folosim distanța laterală față de palmă.
      Nu este perfect pentru orice rotație,
      dar e suficient pentru efectul HUD.
    */

    const thumbTip = hand[4];
    const thumbJoint = hand[3];

    if (
        Math.abs(thumbTip.x - hand[5].x) >
        Math.abs(thumbJoint.x - hand[5].x)
    ) {
        count++;
    }

    return count;
}

function updateFPS(now) {

    frames++;

    if (now - fpsTimer >= 1000) {

        fps = frames;

        fpsElement.textContent =
            "FPS: " + fps;

        frames = 0;
        fpsTimer = now;
    }
}

async function render() {

    const now = performance.now();

    if (
        video.readyState >= 2 &&
        faceLandmarker &&
        handLandmarker
    ) {

        resize();

        if (video.currentTime !== lastVideoTime) {

            lastVideoTime = video.currentTime;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const faceResult =
                faceLandmarker.detectForVideo(
                    video,
                    now
                );

            const handResult =
                handLandmarker.detectForVideo(
                    video,
                    now
                );

            /*
              FACE
            */

            if (
                faceResult.faceLandmarks &&
                faceResult.faceLandmarks.length
            ) {

                drawFace(
                    faceResult.faceLandmarks[0]
                );

                faceStatus.textContent =
                    "FACE: LOCKED";

                status.textContent =
                    "● SCAN LOCKED";

                status.style.color =
                    "#00ff9d";

            } else {

                faceStatus.textContent =
                    "FACE: SEARCHING";

                status.textContent =
                    "● SEARCHING";

                status.style.color =
                    "#ff375f";
            }

            /*
              HANDS
            */

            let totalFingers = 0;

            if (
                handResult.landmarks &&
                handResult.landmarks.length
            ) {

                for (
                    const hand of
                    handResult.landmarks
                ) {

                    drawHand(hand);

                    totalFingers +=
                        fingersUp(hand);
                }

                handStatus.textContent =
                    "HANDS: " +
                    handResult.landmarks.length;

            } else {

                handStatus.textContent =
                    "HANDS: 0";
            }

            fingerElement.textContent =
                "FINGERS: " + totalFingers;

            /*
               Mic efect în funcție de gest.
            */

            if (totalFingers === 5) {

                centerMessage.textContent =
                    "PALM DETECTED";

            } else if (totalFingers === 0) {

                centerMessage.textContent =
                    "SCAN PERFORMING";

            } else {

                centerMessage.textContent =
                    "GESTURE: " +
                    totalFingers;
            }

            updateFPS(now);
        }
    }

    requestAnimationFrame(render);
}

async function start() {

    try {

        status.textContent =
            "● CAMERA START";

        await cameraStart();

        status.textContent =
            "● LOADING AI";

        await loadAI();

        status.textContent =
            "● AI READY";

        status.style.color =
            "#00ff9d";

        render();

    } catch (error) {

        console.error(error);

        status.textContent =
            "● ERROR";

        centerMessage.textContent =
            error.message;
    }
}

start();

</script>

</body>
</html>
